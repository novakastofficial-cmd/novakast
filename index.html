<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaKast - Live Streaming</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }
        video {
            width: 80%;
            max-width: 600px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }
        /* मोबाइल के लिए वीडियो साइज */
        .mobile-vid { display: none; }
        .desktop-vid { display: block; }
        @media (max-width: 768px) {
            .desktop-vid { display: none; }
            .mobile-vid { display: block; width: 95%; }
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #a855f7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- आपका लोगो -->
    <img src="logo.png" alt="NovaKast Logo" class="logo">

    <h1>NovaKast</h1>
    <p>LIVE STREAMING PLATFORM</p>

    <!-- कंप्यूटर के लिए वीडियो -->
    <video class="desktop-vid" controls autoplay muted loop playsinline>
        <source src="desktop-video.mp4" type="video/mp4">
        आपका ब्राउज़र वीडियो का समर्थन नहीं करता है।
    </video>

    <!-- मोबाइल के लिए वीडियो -->
    <video class="mobile-vid" controls autoplay muted loop playsinline>
        <source src="mobile-video.mp4" type="video/mp4">
        आपका ब्राउज़र वीडियो का समर्थन नहीं करता है।
    </video>

    <p style="margin-top: 20px; font-size: 1rem; color: #38bdf8;">Coming Soon - Get ready for a brand new experience.</p>

</body>
</html>
