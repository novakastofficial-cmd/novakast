<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaKast - Coming Soon</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background-color: #0b0f19;
        }
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        /* कंप्यूटर के लिए डेस्कटॉप वीडियो दिखेगा */
        @media (min-width: 768px) {
            .mobile-vid { display: none; }
        }
        /* मोबाइल के लिए मोबाइल वीडियो दिखेगा */
        @media (max-width: 767px) {
            .desktop-vid { display: none; }
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 219, 222, 0.5);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #e2e8f0;
            margin-bottom: 25px;
        }
        .badge {
            display: inline-block;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- डेस्कटॉप वीडियो -->
    <video autoplay muted loop class="bg-video desktop-vid">
        <source src="desktop-video.mp4" type="video/mp4">
    </video>

    <!-- मोबाइल वीडियो -->
    <video autoplay muted loop class="bg-video mobile-vid">
        <source src="mobile-video.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <img src="logo.png" alt="NovaKast Logo" class="logo">
        <h1>NovaKast</h1>
        <p>Live Streaming Platform is launching soon. Get ready for a brand new experience.</p>
        <div class="badge">Coming Soon</div>
    </div>

</body>
</html>
